name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */8 * * *"   # runs every 8 hours
  workflow_dispatch:         # lets you trigger it manually too, for testing

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create timestamp file
        run: |
          mkdir -p .keepalive
          echo "Last keep-alive ping: $(date -u)" > .keepalive/last-ping.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping"
          git push
